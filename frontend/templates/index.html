<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield ML | Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../src/style.css">
</head>

<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <div class="container">
        <div class="dashboard">
            <header>
                <h1>FRAUD SHIELD</h1>
                <p class="subtitle">Detecção Inteligente de Fraudes em Tempo Real</p>
            </header>

            <div class="actions">
                <button class="btn-generate" onclick="generateRandom()">
                    Simular Transação
                </button>
                <button class="btn-predict" onclick="predict()">
                    Verificar Fraude
                </button>
            </div>

            <div class="grid" id="inputGrid">
                <!-- Inputs will be generated here -->
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Analisando padrões...</p>
            </div>

            <div class="result-panel" id="resultPanel">
                <div class="result-title" id="resultTitle">LEGAL</div>
                <p id="resultText">Esta transação parece ser legítima.</p>
                <p id="resultProb" style="margin-top: 5px; opacity: 0.8; font-size: 0.8rem;"></p>
            </div>
        </div>
    </div>

    <script src="../src/script.js"></script>
</body>

</html>
